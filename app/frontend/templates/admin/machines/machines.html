<section ui-tour="machines"
         ui-tour-backdrop="true"
         ui-tour-template-url="'/shared/tour-step-template.html'"
         ui-tour-use-hotkeys="true"
         ui-tour-scroll-parent-id="content-main"
         post-render="setupMachinesTour">

  <machines-list user="currentUser"
                 on-error="onError"
                 on-success="onSuccess"
                 on-show-machine="showMachine"
                 on-reserve-machine="reserveMachine"
                 on-login-requested="onLoginRequest"
                 on-enroll-requested="onEnrollRequest"
                 can-propose-packs="canProposePacks()">
  </machines-list>

  <span tour-step="view"
        tour-step-order="1"
        tour-step-title="{{ 'app.public.tour.machines.view.title' | translate }}"
        tour-step-content="{{ 'app.public.tour.machines.view.content' | translate }}"
        tour-step-placement="top"
        tour-step-enabled="{{ isAuthorized('admin') && hasMachineTourTarget('.machines-list .show-button') }}"
        tour-step-options="{ selector: '.machines-list .show-button' }"></span>

  <span tour-step="reserve"
        tour-step-order="2"
        tour-step-title="{{ 'app.public.tour.machines.reserve.title' | translate }}"
        tour-step-content="{{ 'app.public.tour.machines.reserve.content' | translate }}"
        tour-step-placement="top"
        tour-step-enabled="{{ isAuthorized(['admin', 'manager']) && hasMachineTourTarget('.machines-list .reserve-button') }}"
        tour-step-options="{ selector: '.machines-list .reserve-button' }"></span>

</section>

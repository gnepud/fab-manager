<form class="{{classes}}" ng-submit="save(setting)">
    <div class="form-group">
        <label for="setting-{{setting.name}}" class="control-label m-r" translate>{{ label }}</label>
        <select class="form-control"
              id="setting-{{setting.name}}"
              ng-model="selection"
              ng-options="opt for opt in options"
              multiple>
        </select>
    </div>
    <div>
        <button type="button" ng-click="removeItem()" class="btn btn-default"><i class="fa fa-trash"></i></button>
        <button type="button" ng-click="addItem()" class="btn btn-default"><i class="fa fa-plus"></i></button>
    </div>
  <button type="submit" class="fab-button is-secondary m-t" ng-disabled="setting.value === settings[setting.name]" translate>{{ 'app.shared.buttons.save' }}</button>
</form>
